  epic-51-retrospective: optional  # ADDED 2026-07-26 by bmad-sprint-planning (missing retrospective key).
  epic-52: backlog  # Filters surface + admin curation and governance. Depends on E49 (admin API) + E51 (browse IA patterns). G26-UXGATE CLOSED 2026-07-26 by `_bmad-output/planning-artifacts/ux-designs/ux-3d-portal-2026-07-26/` (Filters and admin contracts included). Every story owns its own i18n keys, component-level a11y assertions and targeted unit/visual coverage at its own merge gate.
  52-1-filters-drawer-consolidation: backlog  # Consolidate tags/facets into a Filters (n) drawer/panel with full tag search inside; at most 2-4 promoted groups outside it, and only when justified. The tiny +tag ribbon control (FilterRibbon.tsx:99-113) stops being the primary tag path while the Filters surface stays discoverable. Category scope is NOT counted in (n). VERIFY-AT-CREATE-STORY: FilterRibbon.tsx's actual structure and the 50.3 suggestion surface as shipped.
  52-2-admin-category-management-screen: backlog  # Admin CRUD, reorder, and per-model replace-set assignment; an "Uncategorized / needs curation" queue; an ADVISORY 1-3 warning that never blocks a write (no hard DB maximum). Reuse the E46 admin tag-group screen patterns rather than re-authoring them. CONCURRENCY HONESTY CARRIES INTO THE UI: under the accepted explicit-LWW posture (49.5) a concurrent editor's change CAN be silently discarded, so this surface must not imply merge or conflict-detection semantics it does not have — re-fetch before opening the editor and, where cheap, surface the audit trail instead.
  52-3-curation-qa-surfaces: backlog  # Surface models with zero or unusually many categories; empty/tiny categories; categories behaving like narrow tags; confusing Category/Tag label overlap; ungrouped user-facing tags (Tag.group_id IS NULL) as visible admin hygiene. ADVISORY ONLY — no automatic synchronization and no membership inference from tags in MVP. Story-creation must pick a CONCRETE number for "unusually many" rather than inherit the vagueness (readiness finding m-2).
  epic-52-retrospective: optional  # ADDED 2026-07-26 by bmad-sprint-planning (missing retrospective key).
  epic-53: backlog  # Mature mobile lightbox — SEPARATE from the shipped E48.1 quickfix, per the operator packet's explicit delivery split. INDEPENDENT PARALLEL TRACK (depends on nothing in E49-E52; the E49->E54 numbering is not a strict order for this epic). GATED ON G26-LIB. Architecture: Decision BA. Not blocked by G26-UXGATE for 53.1 (research output only).
  53-1-lightbox-adoption-spike: backlog  # Score exactly THREE options — (1) Yet Another React Lightbox + Zoom, (2) PhotoSwipe 5.4.x, (3) extend the existing in-house viewer — against: measured bundle-size delta; integration cost with both mounts (ModelGallery on /catalog/$modelId, ShareCarousel on /share/$token) WITHOUT disturbing their renderImage/renderThumb auth boundaries (Always-constraint carried verbatim from the 48.1 spec); accessibility (WAI-ARIA APG modal-dialog, focus trap + return focus, VISIBLE zoom controls per WCAG 2.2 SC 2.5.1/2.5.7); and PHYSICAL Android Chrome gesture quality. ADOPTION IS NOT PRE-DECIDED — the packet records a research preference, not a decision. Option 3 must be scored as seriously as the two libraries: 48.1 proved the component is small, understood and now covered by a geometry regression suite; a dependency has to earn its place. Output is a written recommendation, not code — so this story owns no i18n/a11y/visual surface of its own.
  53-2-mature-lightbox-implementation: backlog  # Pinch zoom, pan, double-tap, PLUS visible Zoom In/Out/Reset as single-pointer alternatives; toolbar stable OUTSIDE the transform layer; body scroll lock with restoration; focus trap/Escape/return focus; safe-area + dynamic-viewport handling; explicit swipe-vs-pan conflict rules. MUST preserve every 48.1 invariant (Decision BA): single-reference-box viewport anchoring (left-[1vw] + translate-x-0, never left-1/2 + -translate-x-1/2), dvh not vh, NEVER user-scalable=no, ui/dialog.tsx is Ask First, and image-viewer-containment.spec.ts stays green (it is a STANDING suite, not one this story replaces). OWNS AT ITS OWN GATE: its new control labels in en+pl, component-level a11y assertions (accessible names for every zoom control, focus trap and return focus, >=44x44 close target), and targeted pl-PL visual coverage.
  53-3-lightbox-test-contract: backlog  # Pixel 5 portrait AND landscape; light AND dark; panorama 4:1 and 8:1; portrait 1:4; small source; close bounds/hit area >=44x44; zero document overflow; rotation refit; zoom/pan clamp and reset; swipe-vs-pan; body-scroll restoration; focus trap/Escape/return focus; error and slow-load; repeated open-close. Synthetic Playwright touch events are REGRESSION EVIDENCE ONLY — final gesture acceptance requires a PHYSICAL Android Chrome smoke, recorded as operator evidence and never simulated or inferred.
  epic-53-retrospective: optional  # ADDED 2026-07-26 by bmad-sprint-planning (missing retrospective key).
  epic-54: backlog  # Cross-surface i18n/a11y/visual audit + rollout and docs. RECAST 2026-07-26 by the controller review: 54.1/54.2 were previously written as if they were where i18n keys, a11y assertions and visual baselines FIRST APPEAR — incompatible with every UI story having to pass check-all 16/16 on its own branch. Per-story ownership is now mandatory (see E50-E53); E54 is the FINAL CROSS-SURFACE AUDIT + REMEDIATION pass. Depends on E51-E53 surfaces landed.
  54-1-i18n-parity-audit: backlog  # RENAMED/RECAST from 54-1-i18n. With every UI story's own keys already shipped and diffed, audit ACROSS surfaces: full en/pl key-set parity for the whole Initiative 26 key space; no placeholder or English-identical Polish left behind; consistent terminology for the same concept across browse nav, scope chip, suggestions, Filters drawer, admin screens and viewer controls (a category is not "Kategoria" on one surface and "Dział" on another). Remediate what the audit finds. VERIFY-AT-CREATE-STORY: which keys already exist — the epic:46 I18N SCOPE NOTE recorded a whole planned i18n scope that had already shipped inside earlier epics, and 47.1's real scope collapsed to two keys once traced. A finding here is a DEFECT IN THE STORY THAT SHIPPED THE SURFACE, not new scope invented at the end.
  54-2-a11y-and-visual-audit: backlog  # RENAMED/RECAST from 54-2-a11y-and-visual-specs. With per-story a11y assertions and targeted baselines already green, audit ACROSS surfaces: end-to-end WCAG 2.2 SC 2.5.1 / 2.5.7 / 2.5.8 over the whole Initiative 26 journey (browse -> scope -> filter -> detail -> viewer), including keyboard-only and screen-reader traversal BETWEEN surfaces which no single component test covers; cross-surface visual consistency in light and dark; and the /api/* route-mock consolidation pass across the suite. Remediate what the audit finds. The per-screenshot toBeVisible() rule is enforced at each story's own gate (epic:45/epic:46 TEST-AUTHORING); this story verifies none slipped.
  54-3-rollout-docs-governance: backlog  # SCOPE NARROWED 2026-07-26 by bmad-check-implementation-readiness: the passages that go stale at story 49.3's deploy (docs/operations.md :426/:463-464/:613-614 and the cutover-smoke.sh:397-405 comment) moved INTO story 49.3. This story retains docs/architecture.md and the agent add-model runbook, so they distinguish the RETIRED mandatory single-category taxonomy from the NEW independent M:N browse categories, plus the agent-facing contract for category assignment. Publish the category governance doc: inclusion criteria, positive/boundary examples, the Category-vs-Tag distinction rule, the periodic QA checklist, AND the recorded explicit-LWW concurrency posture with its named upgrade trigger. This story exists BECAUSE the epic:47 CUTOVER-CHECKLIST action item requires operational probes and live documentation to be scanned, not only apps/ source.
