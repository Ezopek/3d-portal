ntroller-owned closeout group (T8), strict RED->GREEN throughout. SCOPE: 9 product/doc files (6 production + 3 test: 2 NEW test files, 1 additive extension of test_openapi_agent_surface.py's existing _GOVERNANCE_ROUTES set) plus the two workflow records, for a future single commit — NEW apps/api/app/modules/sot/browse_category_admin_router.py; MODIFY admin_schemas.py, admin_service.py, sot/schemas.py, app/core/audit.py (new browse_category KNOWN_ENTITY_TYPES entry), app/router.py; NEW tests/test_sot_admin_categories.py + tests/test_sot_admin_model_categories.py; MODIFY (additive-only) tests/test_openapi_agent_surface.py. No code, test, doc, or live-DB change THIS pass; no commit, push, merge, deploy, migration, seed, or live action. NO human review of any kind; no Ezop signature, no Ezop review, no Laura review recorded or implied — every claim in the story is Claude/native-BMAD-session-only. G26-DEVGO is NOT granted and not addressed by this pass. NEXT: an independent, fresh-context native bmad-create-story:validate (VS) session must re-derive every §6 citation before any bmad-dev-story pass may start. --- prior: RENUMBERED from 49.6. POST/PATCH/DELETE /api/admin/categories under current_admin with an audit row per write; new audit entity_type browse_category + browse_category.* actions. DELETE = 409 Conflict while assignments exist, unless explicit detach=true (detach + delete in one transaction, auditing both the detached model ids AND a count — the epic:42 unbounded-audit-payload note applies by analogy). Depth-2 ceiling + self-cycle rejection enforced in the SERVICE layer (SQLite DDL cannot express it). VERIFY-AT-CREATE-STORY: extend tag_group_admin_router.py + the 42.4 audit posture, do not parallel-implement. REPLACE-SET CONCURRENCY — HONEST POSTURE (corrected 2026-07-26 by the controller review; the earlier "no lost-update ambiguity" claim was WRONG and is RETRACTED): PUT /api/admin/models/{id}/categories sends the whole set, idempotent, EXPLICIT LAST-WRITER-WINS. LWW DOES PERMIT A LOST UPDATE — if admin A and admin B both load a model's categories, A adds `lamps` and saves, then B (still on the pre-A snapshot) adds `kitchen` and saves, A's change is SILENTLY DISCARDED because B's payload never contained it. Replace-set does not prevent this; it only makes the discarded state a whole set rather than a partial merge. ACCEPTED for the current SINGLE-ADMIN deployment as explicit, AUDITABLE LWW: the justification is not that the race is absent but that every write emits an audit row carrying the resulting set, so a lost update is recoverable and attributable after the fact. NAMED FUTURE TRIGGER: the moment a second concurrent admin editor exists, or an automated/agent writer is added, this needs optimistic concurrency (a revision integer or ETag/If-Match returning 409 on stale writes). Until then no revision column and no precondition header is built (minimal-diff).
